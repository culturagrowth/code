name = "duoclip-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Non-secret configuration. Fill these in before deploying (see README.md).
# R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are secrets: `wrangler secret put <NAME>`.
[vars]
ACCOUNT_ID = "7c708b08d5c75a21cb2d61ad1c25c121"
BUCKET_NAME = "povclip"

# Optional circuit breakers against abuse (POST /v1/devices is open by design). Both are counted
# per UTC day for the whole service; a missing or malformed value keeps the default shown here.
# Once all your friends are registered, set MAX_NEW_DEVICES_PER_DAY to "0" to close registration.
# MAX_NEW_DEVICES_PER_DAY = "50"
# MAX_GLOBAL_DAILY_BYTES = "214748364800"          # 200 GiB announced for upload per day

# Binding used for list/delete (DELETE /v1/clips/:clip and the hourly sweep).
# Uploads and downloads never go through the Worker: clients use presigned URLs.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "povclip"

[[d1_databases]]
binding = "DB"
database_name = "duoclip"
database_id = "696b75a4-5499-402d-8076-d20c16f52ac7"
migrations_dir = "migrations"

# Hourly sweep of expired clips, signatures, invites and usage counters.
[triggers]
crons = ["0 * * * *"]

# Keeps the sweep summary (one JSON line per run) and error logs in the dashboard.
[observability]
enabled = true
