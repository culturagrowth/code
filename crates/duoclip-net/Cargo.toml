[package]
name = "duoclip-net"
description = "DuoClip Worker client (signed requests, presigned transfers) and the duoclip-amigos setup tool"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "duoclip_net"

[[bin]]
name = "duoclip-amigos"
path = "src/bin/duoclip-amigos.rs"

[dependencies]
duoclip-proto = { path = "../duoclip-proto" }
duoclip-presence = { path = "../duoclip-presence" }
ed25519-dalek = "3"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
