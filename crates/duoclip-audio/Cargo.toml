[package]
name = "duoclip-audio"
description = "DuoClip audio capture: WASAPI per-process loopback (game, Discord) and microphone, QPC-timestamped"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true

# `#[windows::core::implement]` expands to `::windows_core::...` paths, so the COM completion
# handler needs windows-core as a direct dependency (same version the `windows` crate uses).
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_Performance",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Security",
]
