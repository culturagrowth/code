[package]
name = "duoclip-capture"
description = "DuoClip game capture without injection: Desktop Duplication cropped to the game window (DdaCrop), WGC/Hook stubs"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
duoclip-gamesdb = { path = "../duoclip-gamesdb" }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
duoclip-buffer = { path = "../duoclip-buffer" }
duoclip-encode = { path = "../duoclip-encode" }
duoclip-mux = { path = "../duoclip-mux" }

[target.'cfg(windows)'.dev-dependencies.windows]
workspace = true
features = ["Win32_System_LibraryLoader"]
