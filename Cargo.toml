[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
windows = "0.62"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
